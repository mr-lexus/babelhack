name: Product website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - website-tests/**
      - scripts/serve-website.mjs
      - playwright.website.config.ts
      - .github/workflows/website.yml
      - package-lock.json
  pull_request:
    paths:
      - website/**
      - website-tests/**
      - scripts/serve-website.mjs
      - playwright.website.config.ts
      - .github/workflows/website.yml
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check website/index.html website/styles.css website/site.js website-tests scripts/serve-website.mjs playwright.website.config.ts
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.website.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-test-results
          path: artifacts/website-tests
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: website

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
