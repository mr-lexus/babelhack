[package]
name = "babelhack"
version = "0.7.0"
description = "Cross-platform system audio translator with live subtitles"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mr-lexus/babelhack"

[lib]
name = "babelhack_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
dirs = "6"
cpal = { version = "0.18.1", default-features = false }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
async-openai = { version = "0.41", features = ["chat-completion"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSValue", "NSUUID"] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.1", default-features = false, features = ["pulseaudio"] }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[patch.crates-io]
# GTK3/Tauri still require glib 0.18; backport the upstream memory-safety fix.
glib = { path = "vendor/glib" }

[profile.dev]
opt-level = 1
debug = 1
codegen-units = 256

[profile.test]
debug = false
codegen-units = 256
